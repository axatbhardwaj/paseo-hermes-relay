name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run 54 unit tests
        run: python -m unittest discover -s tests/hermes_review_relay -v
      - name: Compile Python
        run: python -m compileall -q .
